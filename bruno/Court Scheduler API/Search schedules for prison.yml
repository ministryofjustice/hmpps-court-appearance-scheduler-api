info:
  name: Search schedules for prison
  type: http
  seq: 10

http:
  method: POST
  url: "{{base_url}}/search/prisons/{{prison_code}}/court-appearances/schedules"
  body:
    type: json
    data: |-
      {
        "personIdentifiers":["{{person_identifier}}"],
        "start": "{{date_today}}",
        "end": "{{date_next_month}}",
        "status": [
          "SCHEDULED"
        ],
        "external": true,
        "page": 1,
        "size": 10,
        "sort": "start"
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
