info:
  name: Create court appearance
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/court-appearances/{{person_identifier}}"
  body:
    type: json
    data: |-
      {
        "courtCode": "{{court_code}}",
        "reasonCode": "CRT",
        "start": "{{date_next_week}}T10:00:00",
        "end": "{{date_next_week}}T17:00:00",
        "comments": "Some comments to test the API"
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        let createdId = res.body.id;
        bru.setVar('court_appearance_id', createdId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
